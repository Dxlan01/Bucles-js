<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<body>
    <script>
        const n = parseInt(prompt("Ingrese un número entero positivo N:"));
        let suma = 0;

        for (let i = 1; i <= n; i++) {
            if (i % 2 === 0) {
                suma = suma + i;
            }
        }

        alert("La suma de los números pares entre 1 y " + n + " es : " + suma);

    </script>
</body>

</html>
